name: Mobile checks
on:
  pull_request:
    paths: ['apps/mobile/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/mobile.yml']
  push:
    branches: [dev, main]
    paths: ['apps/mobile/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jaguar/mobile lint
      - run: pnpm --filter @jaguar/mobile typecheck
      - run: pnpm --filter @jaguar/mobile exec expo export --platform android --platform ios
