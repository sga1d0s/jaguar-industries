name: jaguar-industries

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: jaguar
      POSTGRES_USER: jaguar_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en Portainer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Acceso desde pgAdmin por la IP LAN del NAS; no escucha en todas las interfaces.
    # 15432 pertenece a Ibex. Jaguar utiliza 15433 y conserva el 5432 interno.
    ports:
      - '${JAGUAR_BIND_IP:?Define la IP LAN del NAS}:${JAGUAR_DB_PORT:-15433}:5432'
    networks:
      - backend
      - db_admin
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *logging

  api:
    image: ${API_IMAGE:?Define API_IMAGE con la imagen y su version}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: '3000'
      PGHOST: db
      PGDATABASE: jaguar
      PGUSER: jaguar_app
      PGPASSWORD: ${APP_DATABASE_PASSWORD:?Define APP_DATABASE_PASSWORD para el rol limitado}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - edge
    ports:
      - '${JAGUAR_BIND_IP:?Define la IP LAN del NAS}:${JAGUAR_HTTP_PORT:-3080}:3000'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

networks:
  backend:
    internal: true
  edge:
  # Docker no activa puertos publicados cuando el contenedor solo tiene redes internal.
  # Esta red adicional habilita el acceso LAN; solo PostgreSQL se conecta a ella.
  db_admin:
    driver: bridge

volumes:
  postgres_data:
