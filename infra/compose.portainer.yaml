# Generado por GitHub Actions. Fuente: 886e863afd36494bb7a77b91229027573a96ffb7
name: jaguar-industries

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: jaguar
      POSTGRES_USER: jaguar_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en Portainer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Acceso desde pgAdmin por la IP LAN del NAS; no escucha en todas las interfaces.
    # 15432 pertenece a Ibex. Jaguar utiliza 15433 y conserva el 5432 interno.
    ports:
      - '${JAGUAR_BIND_IP:?Define la IP LAN del NAS}:${JAGUAR_DB_PORT:-15433}:5432'
    networks:
      - backend
      - db_admin
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *logging

  api:
    image: ghcr.io/sga1d0s/jaguar-industries-api:sha-886e863afd36494bb7a77b91229027573a96ffb7@sha256:c3ae17ed0757ab868c0b471c17b4dd1fe5dbf492d54f5ce01f3a86eb5e04c4cc
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: '3000'
      PGHOST: db
      PGDATABASE: jaguar
      PGUSER: jaguar_app
      PGPASSWORD: ${APP_DATABASE_PASSWORD:?Define APP_DATABASE_PASSWORD para el rol limitado}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - edge
    ports:
      - '${JAGUAR_BIND_IP:?Define la IP LAN del NAS}:${JAGUAR_HTTP_PORT:-3080}:3000'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # Sirve el panel y reenvía /api a Node, conservando la dirección de la app móvil.
  web:
    image: ghcr.io/sga1d0s/jaguar-industries-web:sha-886e863afd36494bb7a77b91229027573a96ffb7@sha256:f25c750423dc9aa0c8fd124bbe0ae6c8cf371e32a856069bc9163fc88999f2a4
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    ports:
      - '${JAGUAR_BIND_IP:?Define la IP LAN del NAS}:${JAGUAR_WEB_PORT:-3082}:8080'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

networks:
  backend:
    internal: true
  edge:
  # Docker no activa puertos publicados cuando el contenedor solo tiene redes internal.
  # Esta red adicional habilita el acceso LAN; solo PostgreSQL se conecta a ella.
  db_admin:
    driver: bridge

volumes:
  postgres_data:
